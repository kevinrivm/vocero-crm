# ============================================================
# Vocero CRM — railway.toml (docs.railway.com/reference/config-as-code)
#
# 2.0 — El agente (Nea) es un segundo servicio del mismo proyecto, desde la
# imagen ghcr.io/kevinrivm/nea-agent:2.1.0, sin dominio público: CRM_BASE_URL
# hacia este servicio por la red privada (http://<servicio>.railway.internal:3000),
# la misma DATABASE_URL con DATABASE_SCHEMA=nea, CRM_BOT_API_KEY = BOT_API_KEY
# de aquí y su LLM_API_KEY. Aquí, BRAIN_DISPATCH_URL hacia
# http://<nea>.railway.internal:8000/vocero/dispatch. Guía: docs/migrar-a-2.0.md.
#
# Railway lo lee al construir desde el código (GitHub o `railway up`) y de él
# toma el builder, el healthcheck y la política de reinicio. Es TODO lo que
# este archivo puede declarar: la base Postgres, el volumen de /data, el
# dominio y las variables se crean desde el panel o con la CLI (cada comando
# y cada bandera existen tal cual en docs.railway.com/cli). Desde un clon del
# repo:
#
#   railway init                               # proyecto nuevo (pregunta el nombre)
#   railway add --database postgres            # servicio «Postgres»
#   railway add --service vocero               # servicio de la app, enlazado a esta carpeta
#   railway volume add --mount-path /data      # adjuntos, logo e icono
#   railway domain --port 3000                 # dominio *.up.railway.app → puerto 3000 de la imagen
#   railway variable set --skip-deploys \
#     'APP_BASE_URL=https://${{RAILWAY_PUBLIC_DOMAIN}}' \
#     'DATABASE_URL=${{Postgres.DATABASE_URL}}' \
#     "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" \
#     "ENCRYPTION_KEY=$(openssl rand -base64 32)" \
#     "META_WEBHOOK_VERIFY_TOKEN=$(openssl rand -hex 32)" \
#     META_GRAPH_API_VERSION=v25.0
#   railway up                                 # construye el Dockerfile en Railway y despliega
#   curl -s https://<dominio>.up.railway.app/api/health
#
# Opcionales después, con `railway variable set`: OPENROUTER_API_TOKEN y
# OPENROUTER_MODEL, META_APP_SECRET, AGENDA=on, CHANNELS, ATRIBUCION=on,
# BOT_API_KEY. MEDIA_DIR no se define: la imagen ya trae /data/media.
# 037: sin volumen, los adjuntos pueden ir a un bucket S3-compatible con
# MEDIA_STORE=bucket y las MEDIA_BUCKET_* (ver .env.example).
#
# - Sin build: `railway add --image ghcr.io/kevinrivm/vocero-crm:2.1.0` crea
#   el servicio desde la imagen publicada. Entonces este archivo NO se lee: el
#   healthcheck (/api/health) y el reinicio se fijan en el panel del servicio.
# - El volumen se monta como root; el entrypoint de la imagen se lo da al
#   usuario de la app en cada arranque. Un servicio con volumen no admite
#   réplicas.
# - Railway declaró obsoletos railway.toml/railway.json a favor de su
#   Infrastructure as Code (`.railway/railway.ts`, `railway config apply`);
#   los sigue leyendo hasta el 2026-12-01 y `railway config migrate` traduce
#   este archivo.
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
# Segundos de espera a que /api/health responda antes de dar el despliegue por
# fallido: cubre las migraciones del arranque.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
